bundle:
  name: exercise_10_permissions_run_as_bundle

include:
  - resources/*.yml

variables:
  default_city:
    description: Default city value for the job parameter.
    default: Pune
  default_min_id:
    description: Default minimum customer ID for the job parameter.
    default: "1"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405609765733903.3.azuredatabricks.net
    run_as:
      user_name: ${workspace.current_user.userName}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE

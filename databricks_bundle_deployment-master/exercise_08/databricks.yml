bundle:
  name: exercise_08_shared_variables_bundle

include:
  - resources/*.yml

variables:
  report_title:
    description: Title printed by the job.
    default: Customer city report
  report_owner:
    description: Owner printed by the job.
    default: training-team
  environment_label:
    description: Environment label printed by the job.
    default: dev
  default_city:
    description: Default city value for the job parameter.
    default: Pune
  default_min_id:
    description: Default minimum customer ID for the job parameter.
    default: "1"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-9f50a039-6cf9.cloud.databricks.com/
    variables:
      environment_label: dev
      default_city: Pune
      default_min_id: "1"

  qa_like:
    mode: development
    workspace:
      host: https://dbc-9f50a039-6cf9.cloud.databricks.com/
    variables:
      environment_label: qa_like
      default_city: London
      default_min_id: "3"

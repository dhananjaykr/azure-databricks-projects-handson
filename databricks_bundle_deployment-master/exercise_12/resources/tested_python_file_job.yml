resources:
  jobs:
    tested_python_file_job:
      name: exercise-12-tested-python-file-job
      parameters:
        - name: city
          default: ${var.default_city}
        - name: min_id
          default: ${var.default_min_id}

      tasks:
        - task_key: run_tested_python_file
          spark_python_task:
            python_file: ../src/main.py
            parameters:
              - "--city={{job.parameters.city}}"
              - "--min_id={{job.parameters.min_id}}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
